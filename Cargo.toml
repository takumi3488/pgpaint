
[package]
description = ""
edition = "2024"
license = "MIT"
name = "pgpaint"
repository = "https://github.com/takumi3488/pgpaint"
version = "0.1.0"
[workspace]
members = [".", "crates/testkit"]
resolver = "3"

[workspace.metadata.dist]
allow-dirty = ["ci"]
cargo-dist-version = "0.32.0"
ci = "github"
github-build-setup = "github-build-setup.yml"
install-path = "CARGO_HOME"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[[bin]]
name = "pgpaint"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
async-stream = "0.3"
async-trait = "0.1"
aurora-dsql-sqlx-connector = { version = "0.2.2", features = ["pool"] }

aws-credential-types = "1"
axum = "0.8"
futures = "0.3"
getrandom = "0.4"
gluon = { git = "https://github.com/smartcrabai/gluon", tag = "v0.1.4", features = [
  "auth",
] }
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "time",
  "tls-rustls-ring-native-roots",
  "uuid",
] }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
  "sync",
  "time",
] }
tower-sessions = "0.15"
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
gluon-build = { git = "https://github.com/smartcrabai/gluon", tag = "v0.1.4" }

[dev-dependencies]
anyhow = "1"
pgpaint-testkit = { path = "crates/testkit" }

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.dist]
inherits = "release"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[patch.crates-io]
testcontainers-modules = { git = "https://github.com/testcontainers/testcontainers-rs-modules-community", rev = "d69e3a09397532accea9d9e907fecc280b1513a8" }
